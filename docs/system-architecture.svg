<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Monocular fitness analysis system architecture</title>
  <desc id="desc">A pipeline from RGB video through tracking, trajectory processing, phase inference, quality gating, and interpretable outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102d45"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="65" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Monocular VBT Research Prototype</text>
  <text x="60" y="100" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Privacy-safe public overview · no participant data · no restricted datasets</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(55 150)"><rect width="180" height="120" rx="18" fill="#173a55" stroke="#38bdf8"/><text x="90" y="48" fill="#e0f2fe" font-size="20" font-weight="700">RGB Video</text><text x="90" y="80" fill="#bae6fd" font-size="15">camera or file</text></g>
    <g transform="translate(285 150)"><rect width="180" height="120" rx="18" fill="#173a55" stroke="#38bdf8"/><text x="90" y="42" fill="#e0f2fe" font-size="19" font-weight="700">Pose / Object</text><text x="90" y="70" fill="#e0f2fe" font-size="19" font-weight="700">Tracking</text><text x="90" y="97" fill="#bae6fd" font-size="14">image coordinates</text></g>
    <g transform="translate(515 150)"><rect width="180" height="120" rx="18" fill="#173a55" stroke="#38bdf8"/><text x="90" y="42" fill="#e0f2fe" font-size="19" font-weight="700">Trajectory</text><text x="90" y="70" fill="#e0f2fe" font-size="19" font-weight="700">Processing</text><text x="90" y="97" fill="#bae6fd" font-size="14">smooth + calibrate</text></g>
    <g transform="translate(745 150)"><rect width="180" height="120" rx="18" fill="#173a55" stroke="#38bdf8"/><text x="90" y="42" fill="#e0f2fe" font-size="19" font-weight="700">Phase &amp; Rep</text><text x="90" y="70" fill="#e0f2fe" font-size="19" font-weight="700">Inference</text><text x="90" y="97" fill="#bae6fd" font-size="14">state machine</text></g>
    <g transform="translate(975 150)"><rect width="180" height="120" rx="18" fill="#173a55" stroke="#38bdf8"/><text x="90" y="42" fill="#e0f2fe" font-size="19" font-weight="700">Quality Gate</text><text x="90" y="72" fill="#bae6fd" font-size="14">accept / reject</text><text x="90" y="97" fill="#bae6fd" font-size="14">with reason codes</text></g>
  </g>
  <g stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"><path d="M235 210 H278"/><path d="M465 210 H508"/><path d="M695 210 H738"/><path d="M925 210 H968"/></g>
  <rect x="355" y="326" width="490" height="52" rx="16" fill="#0f766e" opacity="0.9"/>
  <text x="600" y="359" fill="#ecfeff" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Interpretable outputs: phase · repetition · confidence · rejection reason</text>
</svg>

